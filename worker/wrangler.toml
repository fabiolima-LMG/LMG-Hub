# Configuração do Worker de autenticação do LMG Hub
#
# Dois ambientes:
#   produção   → nome "lmg-auth"          → npx wrangler deploy
#   homologação→ nome "lmg-auth-staging"  → npx wrangler deploy --env staging
#
# Cada ambiente tem seu PRÓPRIO namespace KV (bancos de usuário separados —
# contas de teste em homologação nunca aparecem em produção).
# Depois de rodar `wrangler kv namespace create USERS` (produção) e
# `wrangler kv namespace create USERS --env staging` (homologação),
# cole os ids gerados nos lugares indicados abaixo.

name = "lmg-auth"
main = "lmg-auth-worker.js"
compatibility_date = "2024-11-01"

# ── PRODUÇÃO ──────────────────────────────────────────────
[[kv_namespaces]]
binding = "USERS"
id = "70301f85f3874f89abbd744d6a9405f5"

# ── HOMOLOGAÇÃO ───────────────────────────────────────────
[env.staging]
name = "lmg-auth-staging"

[[env.staging.kv_namespaces]]
binding = "USERS"
id = "8e3298aa8e974dffaa976bcddc4396f7"
# teste do deploy automático
